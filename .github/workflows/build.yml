name: build
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: ./test.sh
      - run: ./build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: SpellDuel
          path: dist/SpellDuel.jar
